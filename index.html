<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111a15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>RIP</title>
<!--
  RIP app mirror — encrypted loader.
  The hosted repo carries ONLY ciphertext (app.enc, AES-256-GCM of the
  gzipped app page) plus this loader and, optionally, wrap.json (the
  content key wrapped under a PBKDF2 passphrase — same public-ciphertext
  law as the vault blob). Decryption happens entirely in the browser:
  passphrase or pasted key on first unlock, then per-device conveniences —
  a PIN, or fingerprint via a WebAuthn passkey with the PRF extension
  (the fingerprint releases a hardware-backed key that unwraps the
  content key; nothing cosmetic). Drill results auto-backup: a shim
  standing in for the artifact-save capability pushes the results island
  to a PRIVATE GitHub repo using a fine-grained token stored here only
  encrypted under the content key.

  2026-09-04 (handoff item 4, staged cutover): when Matt's brain login is
  present on the device the ciphertext is fetched from Firebase Storage
  behind that login (the bucket's rules admit his UID only); GitHub
  Pages' copy is the fallback until PAGES_BLOB is flipped off by
  publish_app.py, after which a fresh device signs in here first.
  Installable as a PWA (manifest + icons + service worker) — item 6.
-->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111a15; color:#e4ebe5;
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
         display:flex; min-height:100vh; align-items:center;
         justify-content:center; }
  .card { width: 20rem; max-width: 92vw; background:#18231d;
          border:1px solid #2a382f; border-radius:14px; padding:1.6rem;
          box-shadow:0 8px 30px rgba(0,0,0,.35); }
  h1 { font-size:1.5rem; margin:0 0 .2rem; letter-spacing:.04em; }
  .sub { color:#9fb0a5; font-size:.85rem; margin:0 0 1.1rem; }
  button { width:100%; padding:.7rem; margin:.3rem 0; border-radius:10px;
           border:1px solid #2a382f; background:#1d2f26; color:#cfe3d6;
           font-size:1rem; cursor:pointer; }
  button.primary { background:#2e6b4e; border-color:#2e6b4e; color:#fff; }
  button:disabled { opacity:.5; }
  input { width:100%; padding:.65rem; margin:.3rem 0; border-radius:10px;
          border:1px solid #2a382f; background:#111a15; color:#e4ebe5;
          font-size:1rem; }
  .msg { min-height:1.3rem; font-size:.85rem; color:#d99181; }
  .ok { color:#7fbf9a; }
  .warn { font-size:.85rem; color:#e0b76a; margin:.2rem 0 .4rem; }
  details { margin-top:.8rem; font-size:.85rem; color:#9fb0a5; }
  details input { font-family: monospace; font-size:.85rem; }
  .showtog { display: block; margin-top: 0.8rem; font-size: 0.85rem;
             color: #9fb0a5; cursor: pointer; user-select: none; }
  .showtog input { width: auto; margin-right: 0.4rem; }
  .row { display:flex; gap:.5rem; }
  .row > * { flex:1; }
  hr { border:0; border-top:1px solid #2a382f; margin:1rem 0; }
  .hide { display:none; }
</style>
</head>
<body>
<script type="application/json" id="rip-data">{}</script>
<div class="card" id="card">
  <h1>&#9823; RIP</h1>
  <p class="sub">Private study.</p>
  <div id="unlock"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
"use strict";
var OWNER = "postmaster87";
var RESULTS_REPO = "rip-results";
var STATE_PATH = "state/results-state.json";
var LS = { prf: "ripapp:wrap-prf", tok: "ripapp:wrap-tok",
           key: "ripapp:key" };
var MAGIC = "RIPAPP1";

// The brain's public config (not a secret; the rules admit one UID).
var FB_CONFIG = {
  apiKey: "AIzaSyBwliXJTbN5gEnN2an1_6TsddHFdnYUD34",
  authDomain: "rip-brain-app.firebaseapp.com",
  projectId: "rip-brain-app",
  storageBucket: "rip-brain-app.firebasestorage.app",
  messagingSenderId: "868882142481",
  appId: "1:868882142481:web:07dea713ef623c5d5968b0"
};
var STORAGE_URL = "https://firebasestorage.googleapis.com/v0/b/" +
  FB_CONFIG.storageBucket + "/o/app.enc?alt=media";
// Stamped by publish_app.py: true while GitHub Pages still carries
// app.enc (the fallback), false after the Storage cutover.
var PAGES_BLOB = true;

var encBuf = null, wrapRemote = null, K = null;
var BLOB_SOURCE = "";   // "storage" | "pages" — for the diagnostics only

// ---------- small utils ----------
function $(id) { return document.getElementById(id); }
function msg(t, ok) { var m = $("msg"); m.textContent = t || "";
  m.className = "msg" + (ok ? " ok" : ""); }
function te(s) { return new TextEncoder().encode(s); }
function b64(buf) {
  var u = new Uint8Array(buf), s = "", CH = 0x8000;
  for (var i = 0; i < u.length; i += CH)
    s += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(s);
}
function unb64(s) {
  var bin = atob(s), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
function rand(n) { var u = new Uint8Array(n); crypto.getRandomValues(u);
  return u; }
function lsGet(k) { try { var v = localStorage.getItem(k);
  return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) {} }
function noAuto(inp) {
  inp.setAttribute("autocapitalize", "none");
  inp.setAttribute("autocorrect", "off");
  inp.setAttribute("spellcheck", "false");
  inp.setAttribute("autocomplete", "off");
  return inp;
}
function addShowToggle(parent) {
  parent.querySelectorAll("input").forEach(function (i) {
    if (i.type !== "checkbox") noAuto(i);
  });
  var lbl = document.createElement("label");
  lbl.className = "showtog";
  lbl.innerHTML = "<input type=\"checkbox\"> show my typing";
  lbl.querySelector("input").addEventListener("change", function () {
    var on = this.checked;
    parent.querySelectorAll("input").forEach(function (inp) {
      if (inp.type === "checkbox") return;
      if (on && inp.type === "password") {
        inp.dataset.was = "1"; inp.type = "text";
      } else if (!on && inp.dataset.was) {
        delete inp.dataset.was; inp.type = "password";
      }
    });
  });
  parent.appendChild(lbl);
}

// ---------- crypto ----------
function kdfKey(secret, saltU8, iter) {
  return crypto.subtle.importKey("raw", te(secret), "PBKDF2", false,
    ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: saltU8, iterations: iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false,
        ["encrypt", "decrypt"]);
    });
}
function rawKey(bytes) {
  return crypto.subtle.importKey("raw", bytes, { name: "AES-GCM" }, false,
    ["encrypt", "decrypt"]);
}
function gcmEncrypt(key, dataU8) {
  var nonce = rand(12);
  return crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce }, key, dataU8)
    .then(function (ct) { return { n: b64(nonce), c: b64(ct) }; });
}
function gcmDecrypt(key, wrap) {
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(wrap.n) },
    key, unb64(wrap.c));
}

// ---------- the brain's login, for the blob ----------
function fbInit() {
  if (typeof firebase === "undefined") return null;
  try {
    return firebase.apps.length ? firebase.app()
                                : firebase.initializeApp(FB_CONFIG);
  } catch (e) { return null; }
}
// Resolves the persisted user (the app page signed in on this device
// before) or null; never hangs the unlock on a slow auth handshake.
function authUser(timeoutMs) {
  return new Promise(function (res) {
    if (!fbInit()) return res(null);
    var done = false;
    var t = setTimeout(function () {
      if (!done) { done = true; res(null); }
    }, timeoutMs);
    try {
      var off = firebase.auth().onAuthStateChanged(function (u) {
        if (done) return;
        done = true; clearTimeout(t); off(); res(u || null);
      });
    } catch (e) {
      if (!done) { done = true; clearTimeout(t); res(null); }
    }
  });
}
function fetchBlobStorage(user) {
  return user.getIdToken().then(function (tok) {
    return fetch(STORAGE_URL, { cache: "no-store",
      headers: { "Authorization": "Firebase " + tok } });
  }).then(function (r) {
    if (!r.ok) throw new Error("storage " + r.status);
    BLOB_SOURCE = "storage";
    return r.arrayBuffer();
  });
}
function fetchBlobPages() {
  return fetch("app.enc", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error("app.enc " + r.status);
    BLOB_SOURCE = "pages";
    return r.arrayBuffer();
  });
}
function fetchBlob() {
  return authUser(2500).then(function (u) {
    if (u) {
      return fetchBlobStorage(u).catch(function (e) {
        if (!PAGES_BLOB) throw e;
        return fetchBlobPages();
      });
    }
    if (!PAGES_BLOB) throw new Error("signin");
    return fetchBlobPages();
  });
}

// ---------- boot ----------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
function boot() {
  Promise.all([
    fetchBlob(),
    fetch("wrap.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
  ]).then(function (got) {
    encBuf = new Uint8Array(got[0]);
    var head = String.fromCharCode.apply(null, encBuf.subarray(0, MAGIC.length));
    if (head !== MAGIC) { msg("app.enc is not a RIP blob"); return; }
    wrapRemote = got[1];
    // Matt's ruling 2026-09-02 ("this is not a crypto wallet"): remembered
    // devices open with NOTHING — or just the fingerprint when enrolled.
    var remembered = lsGet(LS.key);
    var prf = lsGet(LS.prf);
    if (remembered && prf && window.PublicKeyCredential) {
      renderBioGate(prf);
    } else if (remembered) {
      tryKey(unb64(remembered)).then(function (plainBuf) {
        K = unb64(remembered);
        launch(plainBuf);
      }).catch(function () { renderUnlock(); });
    } else {
      renderUnlock();
    }
  }).catch(function (e) {
    if (e && e.message === "signin") { renderSignIn(); return; }
    if (!PAGES_BLOB) { renderSignIn(e.message); return; }
    msg("Load failed: " + e.message);
  });
}
boot();

// Post-cutover fresh device: the blob lives behind the brain's login,
// so sign in here first. The password is the RIP brain account's.
function renderSignIn(why) {
  var u = $("unlock"); u.innerHTML = "";
  msg(why ? "Cloud copy unavailable (" + why + ")." : "", false);
  var w = document.createElement("p"); w.className = "warn";
  w.textContent = "Do NOT type your Google password here. This is the " +
    "RIP brain account password from your password manager.";
  u.appendChild(w);
  var em = noAuto(document.createElement("input"));
  em.type = "email"; em.placeholder = "brain email";
  em.value = "rusty9645@gmail.com";
  var pw = document.createElement("input");
  pw.type = "password"; pw.placeholder = "brain password";
  pw.autocomplete = "current-password";
  var sb = document.createElement("button");
  sb.className = "primary"; sb.textContent = "Sign in to the brain";
  sb.onclick = function () {
    if (!fbInit()) { msg("Sign-in unavailable (no Firebase)."); return; }
    msg("Signing in…", true);
    firebase.auth().signInWithEmailAndPassword(em.value.trim(), pw.value)
      .then(function () { pw.value = ""; msg("Signed in — loading…", true);
                          boot(); })
      .catch(function (e) { msg("Sign-in failed: " + (e && e.message || e)); });
  };
  pw.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sb.click(); });
  u.appendChild(em); u.appendChild(pw); u.appendChild(sb);
  addShowToggle(u);
}

function renderBioGate(prf) {
  var u = $("unlock"); u.innerHTML = "";
  var fb = document.createElement("button");
  fb.className = "primary"; fb.textContent = "Unlock with fingerprint";
  fb.onclick = function () { prfUnlock(prf); };
  u.appendChild(fb);
  var alt = document.createElement("button");
  alt.textContent = "Use password instead";
  alt.onclick = renderUnlock;
  u.appendChild(alt);
}

function tryKey(kBytes) {
  return rawKey(kBytes).then(function (key) {
    var nonce = encBuf.subarray(MAGIC.length, MAGIC.length + 12);
    var ct = encBuf.subarray(MAGIC.length + 12);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, ct);
  });
}

// ---------- unlock UI ----------
var rememberMe = true;
function renderUnlock() {
  var u = $("unlock"); u.innerHTML = "";
  var prf = lsGet(LS.prf);

  if (prf && window.PublicKeyCredential) {
    var fb = document.createElement("button");
    fb.className = "primary"; fb.textContent = "Unlock with fingerprint";
    fb.onclick = function () { prfUnlock(prf); };
    u.appendChild(fb);
  }
  if (wrapRemote) {
    var si = noAuto(document.createElement("input"));
    si.type = "password"; si.placeholder = "Password";
    var sb = document.createElement("button");
    if (!prf) sb.className = "primary";
    sb.textContent = "Unlock";
    sb.onclick = function () { passUnlock(si.value); };
    si.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sb.click(); });
    u.appendChild(si); u.appendChild(sb);
    var rl = document.createElement("label");
    rl.className = "showtog";
    rl.innerHTML = "<input type=\"checkbox\" checked> remember this "
      + "device (open with nothing next time)";
    rl.querySelector("input").addEventListener("change", function () {
      rememberMe = this.checked;
    });
    u.appendChild(rl);
  }
  var adv = document.createElement("details");
  adv.innerHTML = "<summary>Advanced: content key</summary>";
  var ki = document.createElement("input");
  ki.type = "password"; ki.placeholder = "Content key (base64 or hex)";
  ki.autocomplete = "off";
  var kb = document.createElement("button");
  kb.textContent = "Unlock with key";
  kb.onclick = function () {
    var v = ki.value.trim(), bytes = null;
    try {
      if (/^[0-9a-fA-F]{64}$/.test(v)) {
        bytes = new Uint8Array(32);
        for (var i = 0; i < 32; i++)
          bytes[i] = parseInt(v.substr(i * 2, 2), 16);
      } else { bytes = unb64(v); }
    } catch (e) {}
    if (!bytes || bytes.length !== 32) { msg("That is not a 32-byte key."); return; }
    unlocked(bytes, true);
  };
  adv.appendChild(ki); adv.appendChild(kb);
  u.appendChild(adv);
  // No `pin` here — the PIN UI left on 09-02 and a dangling reference
  // threw "Load failed: pin is not defined" on every fresh device.
  if (!prf && !wrapRemote)
    msg("New device: open Advanced and unlock once with the content key " +
        "(password manager). It is remembered after that; fingerprint " +
        "is offered on the next screen.", true);
  addShowToggle(u);
}

function passUnlock(pass) {
  if (!pass || !pass.trim()) { msg("Enter the passphrase."); return; }
  // Forgive what phone keyboards do: stray ends, doubled spaces,
  // an auto-capitalized first letter.
  var cands = [], seen = {};
  [pass, pass.trim(), pass.trim().replace(/\s+/g, " "),
   pass.trim().replace(/\s+/g, " ").toLowerCase()].forEach(function (c) {
    if (!seen[c]) { seen[c] = 1; cands.push(c); }
  });
  msg("Deriving key…", true);
  var i = 0;
  function attempt() {
    if (i >= cands.length) { msg("Wrong passphrase."); return; }
    var c = cands[i++];
    kdfKey(c, unb64(wrapRemote.salt), wrapRemote.iter || 600000)
      .then(function (kek) { return gcmDecrypt(kek, wrapRemote); })
      .then(function (kBuf) { unlocked(new Uint8Array(kBuf), true); })
      .catch(attempt);
  }
  attempt();
}
function prfUnlock(wrap) {
  msg("Touch the sensor…", true);
  navigator.credentials.get({ publicKey: {
    challenge: rand(32), rpId: location.hostname,
    allowCredentials: [{ type: "public-key", id: unb64(wrap.credId) }],
    userVerification: "required",
    extensions: { prf: { eval: { first: unb64(wrap.salt) } } }
  }}).then(function (a) {
    var res = a.getClientExtensionResults();
    var secret = res.prf && res.prf.results && res.prf.results.first;
    if (!secret) throw new Error("no prf");
    return rawKey(new Uint8Array(secret)).then(function (kek) {
      return gcmDecrypt(kek, wrap);
    });
  }).then(function (kBuf) { unlocked(new Uint8Array(kBuf), false); })
    .catch(function (e) { msg("Fingerprint unlock failed — use PIN or passphrase."); });
}

function unlocked(kBytes, firstStyle) {
  tryKey(kBytes).then(function (plainBuf) {
    K = kBytes;
    if (rememberMe) lsSet(LS.key, b64(K));
    var prf = lsGet(LS.prf);
    var wantSetup = location.hash === "#setup"
      || (!prf && !!window.PublicKeyCredential);
    if (wantSetup) renderSetup(plainBuf);
    else launch(plainBuf);
  }).catch(function () { msg("That key does not open this build."); });
}

// ---------- setup ----------
function renderSetup(plainBuf) {
  var u = $("unlock"); u.innerHTML = "";
  msg("Unlocked. One optional step:", true);

  if (window.PublicKeyCredential) {
    var fb = document.createElement("button");
    fb.textContent = "Enable fingerprint on this device";
    fb.onclick = function () { enrollPrf(); };
    u.appendChild(fb);
  }

  var hr = document.createElement("hr"); u.appendChild(hr);
  var ti = document.createElement("input");
  ti.type = "password"; ti.placeholder = "GitHub token (results auto-backup)";
  ti.autocomplete = "off";
  var tb = document.createElement("button");
  tb.textContent = "Save backup token";
  tb.onclick = function () {
    if (!ti.value.trim()) { msg("Paste the fine-grained token first."); return; }
    rawKey(K).then(function (key) {
      return gcmEncrypt(key, te(ti.value.trim()));
    }).then(function (w) { lsSet(LS.tok, w);
      ti.value = "";
      msg("Token saved — testing the pipe…", true);
      testBackup();
    });
  };
  u.appendChild(ti); u.appendChild(tb);
  var tt = document.createElement("button");
  tt.textContent = "Test backup connection";
  tt.onclick = testBackup;
  u.appendChild(tt);

  var go = document.createElement("button");
  go.className = "primary"; go.textContent = "Open the app";
  go.onclick = function () { launch(plainBuf); };
  u.appendChild(go);
  addShowToggle(u);
}

function enrollPrf() {
  msg("Creating passkey…", true);
  navigator.credentials.create({ publicKey: {
    rp: { name: "RIP", id: location.hostname },
    user: { id: rand(16), name: "matt", displayName: "Matt" },
    challenge: rand(32),
    pubKeyCredParams: [{ type: "public-key", alg: -7 },
                       { type: "public-key", alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: "platform",
      residentKey: "preferred", userVerification: "required" },
    extensions: { prf: {} }
  }}).then(function (cred) {
    var ext = cred.getClientExtensionResults();
    if (!(ext.prf && ext.prf.enabled))
      throw new Error("This device's passkey cannot derive keys (no PRF).");
    var salt = rand(32);
    return navigator.credentials.get({ publicKey: {
      challenge: rand(32), rpId: location.hostname,
      allowCredentials: [{ type: "public-key", id: cred.rawId }],
      userVerification: "required",
      extensions: { prf: { eval: { first: salt } } }
    }}).then(function (a) {
      var res = a.getClientExtensionResults();
      var secret = res.prf && res.prf.results && res.prf.results.first;
      if (!secret) throw new Error("PRF returned nothing at assertion time.");
      return rawKey(new Uint8Array(secret)).then(function (kek) {
        return gcmEncrypt(kek, K);
      }).then(function (w) {
        w.credId = b64(cred.rawId); w.salt = b64(salt);
        lsSet(LS.prf, w);
        msg("Fingerprint enabled on this device.", true);
      });
    });
  }).catch(function (e) { msg("Fingerprint setup failed: " + e.message); });
}

// ---------- results auto-backup shim + launch ----------
// Dev feedback channel (Matt, 09-03): every preflight outcome is written
// into a diagnostics block he can copy and paste into chat. Never the
// token itself — only whether one exists and what family it is.
var DIAG = null;
function tokenFamily(tok) {
  if (!tok) return "none";
  if (tok.indexOf("github_pat_") === 0) return "fine-grained";
  if (tok.indexOf("ghp_") === 0) return "classic";
  return "unknown-prefix";
}
function showDiag(lines) {
  DIAG = lines.join("\n");
  var old = $("diag"); if (old) old.remove();
  var box = document.createElement("div"); box.id = "diag";
  var pre = document.createElement("pre");
  pre.style.cssText = "white-space:pre-wrap;font-size:.75rem;color:#9fb0a5;" +
    "background:#111a15;border:1px solid #2a382f;border-radius:10px;" +
    "padding:.6rem;margin:.5rem 0;user-select:text;-webkit-user-select:text;";
  pre.textContent = DIAG;
  var cb = document.createElement("button");
  cb.textContent = "Copy diagnostics";
  cb.onclick = function () {
    var done = function () { cb.textContent = "Copied — paste it to Claude"; };
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(DIAG).then(done, function () {
        cb.textContent = "Copy blocked — long-press the text above";
      });
    else cb.textContent = "Copy blocked — long-press the text above";
  };
  box.appendChild(pre); box.appendChild(cb);
  $("card").appendChild(box);
}

function testBackup() {
  // Preflight: prove the token can actually reach the results repo,
  // BEFORE a training session bets its results on it. Private repos
  // answer 404 (not 401) to a token without access — say so plainly.
  var d = ["RIP backup preflight " + new Date().toISOString(),
           "loader: " + (document.title || "RIP") + " @ " + location.href,
           "blob source: " + (BLOB_SOURCE || "?") + "  pages fallback: " +
             PAGES_BLOB,
           "online: " + navigator.onLine + "  ua: " +
             navigator.userAgent.slice(0, 90)];
  var api = "https://api.github.com/repos/" + OWNER + "/" +
            RESULTS_REPO + "/contents/" + STATE_PATH;
  d.push("target: " + api);
  getToken().then(function (tok) {
    var w = lsGet(LS.tok);
    d.push("token wrap stored: " + !!w + "  decrypted: " + !!tok +
           "  family: " + tokenFamily(tok) +
           "  length: " + (tok ? tok.length : 0));
    if (!tok) {
      msg("No backup token saved on this device.");
      d.push("result: no token"); showDiag(d); return;
    }
    var req;
    try {
      req = fetch(api, { headers: { "Authorization": "Bearer " + tok,
                                    "Accept": "application/vnd.github+json" } });
    } catch (e) {
      msg("The token has a character GitHub headers cannot carry — " +
          "re-paste it.");
      d.push("result: fetch threw synchronously: " + e.name + ": " + e.message);
      showDiag(d); return;
    }
    var t0 = Date.now();
    req.then(function (r) {
        d.push("http: " + r.status + " " + (r.statusText || "") +
               "  in " + (Date.now() - t0) + " ms" +
               "  ratelimit-remaining: " +
               (r.headers.get("x-ratelimit-remaining") || "?"));
        if (r.ok) {
          msg("Backup pipe verified — results will save " +
              "automatically. ✓", true);
          d.push("result: OK — token reaches rip-results");
        } else if (r.status === 404) {
          msg("GitHub cannot see rip-results with this token. Recreate " +
              "it: Settings → Developer settings → Fine-grained " +
              "tokens → Only select repositories → rip-results " +
              "→ Contents: Read and write. Then save it here again.");
          d.push("result: 404 — token not granted to rip-results " +
                 "(or repo name/owner differs)");
        } else if (r.status === 401) {
          msg("Token invalid or expired — generate a new one and " +
              "save it here.");
          d.push("result: 401 — token rejected");
        } else {
          msg("GitHub answered HTTP " + r.status + " — check the " +
              "connection and try again.");
          d.push("result: unexpected HTTP " + r.status);
        }
        return r.text().then(function (body) {
          d.push("body: " + body.slice(0, 160).replace(/\s+/g, " "));
        }).catch(function () {});
      })
      .catch(function (e) {
        msg("No connection to GitHub right now (" + e.name + ": " +
            e.message + ").");
        d.push("result: fetch rejected after " + (Date.now() - t0) +
               " ms: " + e.name + ": " + e.message);
        d.push("hint: a rejected fetch is network/DNS/blocker/CORS, " +
               "not the token — the token was never evaluated");
      })
      .then(function () { showDiag(d); });
  });
}

function getToken() {
  var w = lsGet(LS.tok);
  if (!w || !K) return Promise.resolve(null);
  return rawKey(K).then(function (key) { return gcmDecrypt(key, w); })
    .then(function (buf) { return new TextDecoder().decode(buf); })
    .catch(function () { return null; });
}

function installShim() {
  if (window.claude) return;
  var art = {
    publish: function (html) {
      var m = html.match(
        /<script type="application\/json" id="rip-data">([\s\S]*?)<\/script>/);
      if (!m) return Promise.reject({ code: "no-island" });
      var data;
      try { data = JSON.parse(m[1]); }
      catch (e) { return Promise.reject({ code: "bad-island" }); }
      var slim = { generated: data.generated, queue: data.queue,
                   results: data.results || [],
                   info_marks: data.info_marks || [],
                   split_marks: data.split_marks || [],
                   saved_at: new Date().toISOString() };
      return getToken().then(function (tok) {
        if (!tok) return Promise.reject({ code: "no-token" });
        var api = "https://api.github.com/repos/" + OWNER + "/" +
                  RESULTS_REPO + "/contents/" + STATE_PATH;
        var headers = { "Authorization": "Bearer " + tok,
                        "Accept": "application/vnd.github+json" };
        return fetch(api, { headers: headers }).then(function (r) {
          return r.ok ? r.json().then(function (j) { return j.sha; })
                      : null;
        }).catch(function () { return null; }).then(function (sha) {
          var body = { message: "drill results " + slim.saved_at,
                       content: b64(te(JSON.stringify(slim, null, 1))) };
          if (sha) body.sha = sha;
          return fetch(api, { method: "PUT", headers: headers,
                              body: JSON.stringify(body) });
        }).then(function (put) {
          if (!put.ok) return Promise.reject({ code: "push-" + put.status });
        });
      });
    }
  };
  // Legacy due-line channel (pre-brain): the page now stores its push
  // subscription in the brain itself when signed in; this GitHub path
  // stays only as the shim's contract and nothing reads it any more.
  var pushstore = {
    save: function (sub) {
      return getToken().then(function (tok) {
        if (!tok) return Promise.reject({ code: "no-token" });
        var api = "https://api.github.com/repos/" + OWNER + "/" +
                  RESULTS_REPO + "/contents/state/push-subscription.json";
        var headers = { "Authorization": "Bearer " + tok,
                        "Accept": "application/vnd.github+json" };
        return fetch(api, { headers: headers }).then(function (r) {
          return r.ok ? r.json().then(function (j) { return j.sha; })
                      : null;
        }).catch(function () { return null; }).then(function (sha) {
          var body = { message: "push subscription " +
                         new Date().toISOString(),
                       content: b64(te(JSON.stringify(sub, null, 1))) };
          if (sha) body.sha = sha;
          return fetch(api, { method: "PUT", headers: headers,
                              body: JSON.stringify(body) });
        }).then(function (put) {
          if (!put.ok) return Promise.reject({ code: "push-" + put.status });
        });
      });
    }
  };
  window.claude = {
    use: function (cap) {
      return Promise.resolve(cap === "artifact" ? art
        : cap === "pushstore" ? pushstore : null);
    }
  };
}

function launch(plainBuf) {
  msg("Opening…", true);
  new Response(
    new Blob([plainBuf]).stream().pipeThrough(new DecompressionStream("gzip"))
  ).text().then(function (html) {
    installShim();
    document.open();
    // The app page starts at <meta charset>; without a doctype the
    // rewritten document lands in quirks mode. Prepend it always.
    document.write(/^\s*<!doctype/i.test(html) ? html
                   : "<!doctype html>\n" + html);
    document.close();
  }).catch(function (e) { msg("Decompress failed: " + e.message); });
}
